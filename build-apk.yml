name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack CALC.zip
        run: |
          if [ -f CALC.zip ]; then
            unzip -o CALC.zip
            rm CALC.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Unpack CALC.zip" || true
            git push || true
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          mkdir -p www/fonts && cp index.html www/
          curl -L -o www/fonts/cairo.ttf "https://github.com/google/fonts/raw/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf"
          curl -L -o www/fonts/tajawal.ttf "https://github.com/google/fonts/raw/main/ofl/tajawal/Tajawal-Regular.ttf"
          curl -L -o www/fonts/amiri.ttf "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf"
          cp IBMPlexSansArabic-Bold.ttf www/fonts/plex.ttf
          mkdir assets && cp icon-*.png assets/
          npm init -y
          npm i --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/speech-recognition
          npm i -D --legacy-peer-deps @capacitor/assets
          npx cap init Calculator com.mohammed.calculator --web-dir=www
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n    <application#' android/app/src/main/AndroidManifest.xml
          npx capacitor-assets generate --android
          npx cap sync
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

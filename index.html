<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F8F7F3">
<title>الحاسبة</title>
<style>
:root{--bg:#F8F7F3;--sur:#FDFDFB;--key:#EFEDE6;--fnbg:#EFEDE6;--line:#D7D5CB;--tx:#1B1C1A;--mut:#44463F;--ac:#185FA5;--eqtx:#FFFFFF;--opbg:#D6E7F9;--ac2:#0B3E6F;--clbg:#FCEBEB;--cltx:#A32D2D}
@font-face{font-family:Cairo;src:url(fonts/cairo.ttf);font-weight:200 1000;font-display:swap}
@font-face{font-family:Tajawal;src:url(fonts/tajawal.ttf);font-display:swap}
@font-face{font-family:"IBM Plex Sans Arabic";src:url(fonts/plex.ttf);font-weight:700;font-display:swap}
@font-face{font-family:Amiri;src:url(fonts/amiri.ttf);font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Cairo",system-ui,-apple-system,"Noto Sans Arabic",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.app{height:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
header{display:flex;gap:8px;align-items:center}
.tabs{flex:1;display:flex;padding:4px;border-radius:16px;background:var(--sur);border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:.95rem;font-weight:600;padding:9px 4px;border-radius:12px;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--eqtx)}
.ib{width:44px;height:44px;flex:0 0 auto;border-radius:14px;border:1px solid var(--line);background:var(--sur);color:var(--ac2);font:inherit;font-size:.95rem;font-weight:700;cursor:pointer;display:grid;place-items:center}
#calc{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.screen{position:relative;flex:0 0 auto;min-height:clamp(110px,22vh,200px);border-radius:24px;padding:14px 20px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;direction:ltr;background:var(--sur);border:1px solid var(--line);overflow:hidden}
.mic{position:absolute;top:12px;left:12px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--fnbg);color:var(--ac2);cursor:pointer;display:grid;place-items:center}
.mic.on{background:var(--ac);color:var(--eqtx);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(128,128,128,.28)}}
.expr,.out{max-width:100%;overflow-x:auto;white-space:nowrap;font-variant-numeric:tabular-nums;scrollbar-width:none}
.expr{font-size:clamp(1.7rem,5.5vmin,2.8rem);font-weight:500}
.out{font-size:clamp(1.1rem,3.4vmin,1.6rem);color:var(--mut);min-height:1.4em}
.screen.done .expr{font-size:1.1rem;color:var(--mut)}
.screen.done .out{font-size:clamp(2.4rem,8vmin,4rem);font-weight:700;color:var(--ac2)}
.pads{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;direction:ltr}
.sci,.std{display:grid;gap:8px;min-height:0}
.sci{grid-template-columns:repeat(5,1fr);flex:4}
.std{grid-template-columns:repeat(4,1fr);flex:5}
[data-mode=std] .sci{display:none}
@media (min-width:700px) and (min-aspect-ratio:1/1){[data-mode=sci] .pads{flex-direction:row}[data-mode=sci] .sci{flex:6}[data-mode=sci] .std{flex:5}}
.k{min-height:40px;border-radius:18px;border:1px solid var(--line);background:var(--key);color:var(--tx);font:inherit;font-size:clamp(1.1rem,3.2vmin,1.8rem);font-weight:500;cursor:pointer;display:grid;place-items:center;transition:transform .08s,filter .1s}
.k:active{transform:scale(.94);filter:brightness(.92)}
.k:focus-visible,.ib:focus-visible,.mic:focus-visible,.tabs button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.k.op{background:var(--opbg);color:var(--ac2);border-color:transparent;font-weight:600}
.k.fn{background:var(--fnbg);color:var(--ac2);font-size:clamp(.85rem,2.4vmin,1.25rem);border-color:transparent}
.k.cl{background:var(--clbg);color:var(--cltx);border-color:transparent;font-weight:700}
.k.tog.on{background:var(--ac);color:var(--eqtx)}
.k.eq{background:var(--ac);border-color:transparent;color:var(--eqtx);font-size:clamp(1.4rem,4vmin,2.2rem)}
.k.zero{grid-column:span 2}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translate(-50%,-8px);max-width:90%;background:var(--ac);color:var(--eqtx);padding:8px 16px;border-radius:14px;font-size:.95rem;opacity:0;pointer-events:none;transition:.2s;z-index:5;direction:ltr;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
#conv{flex:1;min-height:0;overflow-y:auto;display:none;flex-direction:column;gap:12px}
[data-mode=conv] #conv{display:flex}
[data-mode=conv] #calc,[data-mode=conv] .mic{display:none}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cats button{flex:0 0 auto;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--sur);color:var(--tx);font:inherit;cursor:pointer}
.cats button.on{background:var(--ac);color:var(--eqtx);border-color:transparent}
.card{display:flex;gap:10px;padding:14px;border-radius:22px;background:var(--sur);border:1px solid var(--line);direction:ltr}
.card input{flex:1;min-width:0;background:none;border:0;color:var(--tx);font:inherit;font-size:clamp(1.6rem,6vmin,2.6rem);font-weight:600;outline:none;text-align:left}
.card select{flex:0 0 42%;max-width:220px;background:var(--fnbg);color:var(--tx);border:1px solid var(--line);border-radius:14px;font:inherit;padding:8px}
#swap{align-self:center;width:52px;height:52px;border-radius:50%;border:0;background:var(--ac);color:var(--eqtx);cursor:pointer;display:grid;place-items:center}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{width:min(560px,100%);max-height:90%;overflow-y:auto;background:var(--sur);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 20px)}
.panel h2{margin:0 0 6px;font-size:1.25rem}
.row{margin-top:16px}.row b{display:block;margin-bottom:8px;color:var(--mut);font-size:.9rem}
.seg,.dots{display:flex;flex-wrap:wrap;gap:8px}
.seg button{padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--key);color:var(--tx);font:inherit;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--eqtx);border-color:transparent}
.dot{width:40px;height:40px;border-radius:50%;border:0;cursor:pointer}
.dot.on{outline:3px solid var(--tx);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.k,.toast,.mic.on{transition:none;animation:none}}
</style>
</head>
<body data-t="dark" data-mode="std">
<div class="toast" id="toast" role="status"></div>
<div class="sheet" id="sheet" hidden><div class="panel" role="dialog">
  <h2 data-i="settings"></h2>
  <div class="row"><b data-i="themeMode"></b><div class="seg" id="sMode"></div></div>
  <div class="row"><b data-i="accent"></b><div class="dots" id="sAcc"></div></div>
  <div class="row"><b data-i="font"></b><div class="seg" id="sFont"></div></div>
  <div class="row"><b data-i="language"></b><div class="seg" id="sLang"></div></div>
</div></div>
<main class="app">
  <header>
    <nav class="tabs" id="tabs">
      <button data-m="std" class="on" data-i="std"></button>
      <button data-m="sci" data-i="sci"></button>
      <button data-m="conv" data-i="conv"></button>
    </nav>
    <button class="ib" id="set" type="button"></button>
  </header>

  <section id="calc">
    <div class="screen" id="screen" aria-live="polite">
      <button class="mic" id="mic" type="button"></button>
      <div class="expr" id="expr">0</div>
      <div class="out" id="out"></div>
    </div>
    <div class="pads"><div class="sci" id="sci"></div><div class="std" id="std"></div></div>
  </section>

  <section id="conv">
    <div class="cats" id="cats"></div>
    <div class="card"><input id="vA" inputmode="decimal" value="1"><select id="uA"></select></div>
    <button id="swap" type="button"></button>
    <div class="card"><input id="vB" inputmode="decimal"><select id="uB"></select></div>
  </section>
</main>

function norm(s){return s.toLowerCase().replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[٠-٩]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'.indexOf(c)}).replace(/٫/g,'.').replace(/(\d)[,،](?=\d)/g,'$1')}
function voice(txt){
  var c=norm(txt).trim();
  if(/^(امسح|مسح|الغي|نظف|صفر الكل|clear|reset|clean)( الكل| all)?$/.test(c)){act('clear');return true}
  if(/^(احذف|تراجع|backspace|delete|undo)$/.test(c)){act('back');return true}
  var s=' '+c+' ';
  VD.forEach(function(r){s=s.replace(r[0],r[1])});
  s=s.replace(/-/g,'−').replace(/\*/g,'×').replace(/\//g,'÷').replace(/([+−×÷^()!%=])/g,' $1 ');
  var o=[];
  s.trim().split(/\s+/).forEach(function(w){
    var k=w.replace(/^و(?=.)/,''),n=NW.hasOwnProperty(w)?NW[w]:(NW.hasOwnProperty(k)?NW[k]:undefined);
    if(n===undefined){o.push({s:w});return}
    var p=o[o.length-1];
    if(p&&p.w&&p.n>=20&&p.n%10===0&&p.n<100&&n>0&&n<10)p.n+=n;
    else if(p&&p.w&&n===100&&p.n>0&&p.n<10)p.n*=100;
    else if(p&&p.w&&k!==w&&p.n>0&&p.n<10&&n>=20&&n<100&&n%10===0)p.n+=n;
    else o.push({n:n,w:1});
  });
  var tk=o.map(function(x){return x.w?String(x.n):x.s}).filter(function(w){return /^(\d+\.?\d*|\.\d+|[+−×÷^()!%=π]|\^\d|(a?sin|a?cos|a?tan|log|ln|√))$/.test(w)});
  var eq=tk.indexOf('=')>-1;tk=tk.filter(function(w){return w!=='='});
  if(!tk.length)return false;
  var j=tk.join('');
  S.expr=(S.done&&/^[+−×÷^%!]/.test(j))?toExpr(S.raw)+j:j;S.done=false;preview();render();
  if(eq)act('eq');return true;
}
function recognize(){
  var lg=S.lang==='ar'?'ar-EG':'en-US',P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.SpeechRecognition;
  if(P)return P.requestPermissions().then(function(p){
    if(p&&p.speechRecognition&&p.speechRecognition!=='granted'){throw 'perm'}
    return P.start({language:lg,maxResults:3,prompt:t('listen'),popup:true,partialResults:false});
  }).then(function(r){return r&&r.matches||[]});
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return Promise.reject('nov');
  return new Promise(function(res,rej){var r=new SR();r.lang=lg;r.maxAlternatives=3;
    r.onresult=function(e){var a=[];for(var i=0;i<e.results[0].length;i++)a.push(e.results[0][i].transcript);res(a)};
    r.onerror=function(){rej('verr')};r.onnomatch=function(){rej('verr')};r.start()});
}
$('mic').addEventListener('click',function(){
  var b=$('mic');if(b.classList.contains('on'))return;
  b.classList.add('on');toast(t('listen'),8000);

    var ok=false;for(var i=0;i<m.length&&!ok;i++)ok=voice(m[i]);
    if(ok)toast('🎤 '+m[0],2500);else toast(t('verr'));

});

function fo(v){if(!isFinite(v))return'';if(v===0)return'0';var a=Math.abs(v);return(a>=1e12||a<1e-6)?v.toExponential(5):String(parseFloat(v.toPrecision(10)))}
function conv(){
  var s=last,d=s==='A'?'B':'A',us=C[ci][1][$('u'+s).value],ud=C[ci][1][$('u'+d).value];
